function collectClientLogContext() {
  return collectThirdPartyIpObservation().then(function(ipObs) {
    var clientId = '';

      clientId = localStorage.getItem('os_client_id') || '';

        clientId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,12));
        localStorage.setItem('os_client_id', clientId);
      }
    } catch(_) {}
    var ctx = {
      client_ts: new Date().toISOString(), client_id: clientId,
      page_url: location.href, page_path: location.pathname,
      referrer: document.referrer || '', user_agent: navigator.userAgent || '',
      language: navigator.language || '', timezone: '',
      timezone_offset_min: new Date().getTimezoneOffset(),
      screen_w: (window.screen && screen.width) || null,
      screen_h: (window.screen && screen.height) || null,
      dpr: window.devicePixelRatio || null,

(function _sessionContextBeacon() {
  if (!GAS_ENV) return;

  try {
    var last = Number(sessionStorage.getItem('os_ctx_beacon_ts') || 0);

function translateRpcError(err, fallback) {
  try { console.error('[RPC error]', err); } catch(_) {}
  if (!err) return fallback || MSG.error.generic;
  var code = '';
  if (typeof err === 'string') code = err;
  else if (err.error)   code = String(err.error);
  else if (err.message) code = String(err.message);
  if (_RPC_ERR_MAP[code]) return _RPC_ERR_MAP[code];
  for (var k in _RPC_ERR_MAP) { if (code && code.indexOf(k) === 0) return _RPC_ERR_MAP[k]; }
  if (code && /[฀-๿]/.test(code) && !/[<>{}\[\]]/.test(code) && code.length < 200) return code;
  return fallback || MSG.error.generic;
}

/* ---------- Button helpers ---------- */
function _setButtonBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) {
    if (!btn.dataset.originalHtml) btn.dataset.originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>' + (label || 'กำลังดำเนินการ…');
  } else {
    btn.disabled = false;
    if (btn.dataset.originalHtml) { btn.innerHTML = btn.dataset.originalHtml; delete btn.dataset.originalHtml; }
  }
}

function withButtonLoading(btn, busyLabel, asyncFn) {
  _setButtonBusy(btn, true, busyLabel);
  return Promise.resolve().then(asyncFn).finally(function() { _setButtonBusy(btn, false); });

/* callRpcWithFeedback: uses raw callRpc — callers must include token in opts.args */
function callRpcWithFeedback(opts) {
  opts = opts || {};
  var btn = opts.button || null;
  var busyText = opts.busyText || MSG.loading.generic;
  var successText = opts.successText || MSG.success.save;
  var errorFallback = opts.errorText || MSG.error.generic;
  var silent = !!opts.silent;
  if (!silent) showHUD(busyText);
  if (btn) _setButtonBusy(btn, true, busyText);
  var args = [opts.method].concat(opts.args || []);
  return callRpc.apply(null, args)
    .then(function(res) {
      if (res && res.ok === false) throw { error: res.error || errorFallback };
      if (!silent) hideHUD('ok', successText);
      return res;
    })
    .catch(function(err) {
      var msg = translateRpcError(err, errorFallback);
      if (!silent) hideHUD('err', msg);
      throw err;
    })
    .finally(function() { if (btn) _setButtonBusy(btn, false); });
}

/* ---------- Pagination ---------- */
function _paginate(allItems, page, pageSize) {
  var total = allItems.length;
  var totalPages = Math.max(1, Math.ceil(total / pageSize));
  var p = Math.max(1, Math.min(page, totalPages));
  var start = (p - 1) * pageSize;
  return {
    items: allItems.slice(start, start + pageSize),
    page: p,
    totalPages: totalPages,
    total: total,
    from: total === 0 ? 0 : start + 1,
    to: Math.min(start + pageSize, total)
  };
}

/* _bindPaginationBar: wires a pagination bar to a render function.
 *   container:  element id or element containing #pgPrev, #pgNext, #pgInfo, #pgSize
 *   getItems:   function() -> filtered array (called on every render)
 *   renderRows: function(items) -> void (renders the visible slice to DOM)
 */
function _bindPaginationBar(container, getItems, renderRows) {
  var el = typeof container === 'string' ? document.getElementById(container) : container;
  if (!el) return;
  var prevBtn  = el.querySelector('#pgPrev');
  var nextBtn  = el.querySelector('#pgNext');
  var infoEl   = el.querySelector('#pgInfo');
  var sizeEl   = el.querySelector('#pgSize');
  var _page = 1;
  var _size = sizeEl ? parseInt(sizeEl.value, 10) || 20 : 20;

  function _render() {
    var result = _paginate(getItems(), _page, _size);
    _page = result.page;
    renderRows(result.items);
    if (infoEl) infoEl.textContent = result.total === 0 ? 'ไม่พบรายการ' : 'แสดง ' + result.from + '–' + result.to + ' จาก ' + result.total + ' รายการ';
    if (prevBtn) prevBtn.disabled = _page <= 1;
    if (nextBtn) nextBtn.disabled = _page >= result.totalPages;
  }
  if (prevBtn) prevBtn.addEventListener('click', function() { if (_page > 1) { _page--; _render(); } });
  if (nextBtn) nextBtn.addEventListener('click', function() { _page++; _render(); });
  if (sizeEl)  sizeEl.addEventListener('change', function() { _size = parseInt(sizeEl.value, 10) || 20; _page = 1; _render(); });
  return { render: _render, reset: function() { _page = 1; _render(); } };
}

/* ---------- Utility ---------- */
function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function escAttr(s) {
  return String(s || '').replace(/[&<>"'`]/g, function(c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;', '`':'&#96;' })[c];
  });
}
function safeUrl(s) {
  var str = String(s || '').trim();
  if (/^(https?:\/\/|\/)/i.test(str)) return str;
  return '';
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('th-TH', { dateStyle:'short', timeStyle:'short' });
}
function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('th-TH', { dateStyle:'short' });
}

function _extractDriveFileId(url) {
  var s = String(url || '');
  var m = s.match(/\/file\/d\/([^/?#]+)/);
  if (m) return m[1];
  m = s.match(/[?&]id=([^&#]+)/);
  return m ? m[1] : '';
}

function _ensureBrandLogoFallback(logoEl) {
  if (!logoEl || !logoEl.parentNode) return null;
  var fb = document.getElementById('brandLogoFallback');
  if (!fb) {
    fb = document.createElement('div');
    fb.id = 'brandLogoFallback';
    fb.className = 'brand-logo-fallback';
    fb.innerHTML = '<i class="bi bi-shop"></i>';
    logoEl.parentNode.insertBefore(fb, logoEl.nextSibling);
  }
  return fb;
}

function _showBrandLogoFallback(logoEl) {
  var fb = _ensureBrandLogoFallback(logoEl);
  if (logoEl) {
    logoEl.removeAttribute('src');
    logoEl.style.display = 'none';
  }
  if (fb) fb.style.display = 'inline-flex';
}

function _showBrandLogoImage(logoEl, src) {
  if (!logoEl || !src) { _showBrandLogoFallback(logoEl); return; }
  var fb = _ensureBrandLogoFallback(logoEl);
  logoEl.onload = function() {
    logoEl.style.display = 'block';
    if (fb) fb.style.display = 'none';
  };
  logoEl.onerror = function() { _showBrandLogoFallback(logoEl); };
  logoEl.src = src;
}

function _bindAdminBrandLogo(info) {
  var logoEl = document.getElementById('brandLogo');
  if (!logoEl) return;
  var logoUrl = (info && info.logoImage) || '';
  var logoFid = (info && info.logoImageDriveFileId) || _extractDriveFileId(logoUrl);
  var cacheKey = 'SHOP_BRAND_CACHE_V1';

  if (!logoUrl && !logoFid) {
    _showBrandLogoFallback(logoEl);
    return;
  }

  if (logoFid) {
    try {
      var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      var cacheMatches = cached && cached.logo && (!cached.logoFid || cached.logoFid === logoFid);
      if (cacheMatches && String(cached.logo).indexOf('data:') === 0) {
        _showBrandLogoImage(logoEl, cached.logo);
        return;
      }
    } catch(_) {}
  }

  if (logoFid && GAS_ENV) {
    callRpc('getFileDataUrlRpc', logoFid).then(function(r) {
      if (r && r.ok && r.dataUrl) {
        try { localStorage.setItem(cacheKey, JSON.stringify({ logo:r.dataUrl, title:(info && info.siteTitle) || '', logoFid:logoFid, ts:Date.now() })); } catch(_) {}
        _showBrandLogoImage(logoEl, r.dataUrl);
      } else if (logoUrl && !/drive\.google\.com/i.test(logoUrl)) {
        _showBrandLogoImage(logoEl, logoUrl);
      } else {
        _showBrandLogoFallback(logoEl);
      }
    }).catch(function() {
      if (logoUrl && !/drive\.google\.com/i.test(logoUrl)) _showBrandLogoImage(logoEl, logoUrl);
      else _showBrandLogoFallback(logoEl);
    });
    return;
  }

  if (logoUrl && !/drive\.google\.com/i.test(logoUrl)) {
    _showBrandLogoImage(logoEl, logoUrl);
  } else {
    _showBrandLogoFallback(logoEl);
  }
}

/* ---------- Shared page setup ----------
 * Call _setupAdminPage() inside each page's DOMContentLoaded handler.
 * Sets up: sidebar nav links, logout button, brand name/logo.
 */
function _setupAdminPage() {
  document.querySelectorAll('.side-nav .link[data-page]').forEach(function(a) {
    var href = _adminPageUrl(a.dataset.page);
    a.setAttribute('href', href);
    a.addEventListener('click', function(e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      a.classList.add('is-loading');
      _showPageNavigating('กำลังเปิดหน้า…');
      setTimeout(function() { _nav(href); }, 90);
    });
  });
  var logoutBtn = document.getElementById('btnLogout');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function() {
      _showPageNavigating('กำลังออกจากระบบ…');
      _rpc('logoutRpc').then(function() { _redirectToLogin(); }).catch(function() { _redirectToLogin(); });
    });
  }
  // แสดง logo จาก cache ทันทีก่อน RPC จะตอบกลับ (stale-while-revalidate)
  // ถ้าไม่มี cache ให้ show fallback icon ทันที (ไม่รอ RPC ให้ UI ว่างเปล่า)
  (function() {
    function _isUsable(s) {
      if (!s) return false;
      if (s.indexOf('data:') === 0) return true;
      return /^https?:\/\//i.test(s) && s.indexOf('drive.google.com') < 0;
    }
    try {
      var _earlyCache = JSON.parse(localStorage.getItem('SHOP_BRAND_CACHE_V1') || 'null');
      if (_earlyCache && _isUsable(_earlyCache.logo)) {
        _showBrandLogoImage(document.getElementById('brandLogo'), _earlyCache.logo);
        var _earlyName = document.getElementById('brandName');
        if (_earlyName && _earlyCache.title) { _earlyName.textContent = _earlyCache.title; _earlyName.classList.remove('brand-skeleton'); }
        return;
      }
    } catch(_) {}
    // ไม่มี cache — show fallback icon ทันที แทนที่จะว่างเปล่าจนกว่า RPC จะตอบ
    _showBrandLogoFallback(document.getElementById('brandLogo'));
  })();
  if (GAS_ENV) {
    google.script.run.withSuccessHandler(function(r) {
      if (!r || !r.ok) { _showBrandLogoFallback(document.getElementById('brandLogo')); return; }
      var nameEl = document.getElementById('brandName');
      if (nameEl) { nameEl.textContent = r.siteTitle || ''; nameEl.classList.remove('brand-skeleton'); }
      _bindAdminBrandLogo(r);
    }).getBrandInfoRpc();
  } else {
    _showBrandLogoFallback(document.getElementById('brandLogo'));
  }
}
